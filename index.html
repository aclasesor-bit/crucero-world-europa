<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    margin:0;min-height:100svh;display:grid;place-items:center;padding:28px;
    background:radial-gradient(120% 80% at 70% 0%,#1d4a86 0%,rgba(29,74,134,0) 62%),
               linear-gradient(165deg,#0a1f44 0%,#061229 100%);
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .box{width:100%;max-width:340px;text-align:center}
  .mark{width:78px;height:78px;margin:0 auto 22px;display:block;border-radius:20px;box-shadow:0 12px 30px -12px rgba(0,0,0,.7)}
  .kicker{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:#e0cfa8;font-weight:700;margin:0 0 8px}
  h1{margin:0 0 6px;font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  .sub{margin:0 0 26px;font-size:13.5px;color:#a9bdd8}
  form{display:grid;gap:11px}
  input[type=password]{
    width:100%;padding:14px 16px;font-size:16px;font-family:inherit;
    background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
    border-radius:13px;color:#fff;text-align:center;letter-spacing:.02em;
    transition:border-color .15s ease,background .15s ease;
  }
  input[type=password]::placeholder{color:#8199bb}
  input[type=password]:focus{outline:none;border-color:#b9975b;background:rgba(255,255,255,.12)}
  button{
    width:100%;padding:14px 16px;font-size:15.5px;font-weight:700;font-family:inherit;
    background:linear-gradient(135deg,#e0cfa8,#b9975b);border:0;border-radius:13px;color:#0a1f44;cursor:pointer;
    transition:transform .12s ease,filter .15s ease;
  }
  button:active{transform:scale(.985)}
  button:disabled{filter:grayscale(.5) brightness(.85);cursor:default}
  .remember{display:flex;align-items:center;justify-content:center;gap:8px;font-size:13px;color:#a9bdd8;margin-top:2px;cursor:pointer}
  .remember input{accent-color:#b9975b;width:16px;height:16px}
  .msg{min-height:20px;font-size:13px;margin:14px 0 0;color:#ffb4a2}
  .hint{margin:26px 0 0;font-size:11.5px;color:#7e93b4;line-height:1.6}
</style>
</head>
<body>
  <div class="box">
    <img class="mark" src="icon-192.png" alt="">
    <p class="kicker">Acceso privado</p>
    <h1>Nuestro crucero</h1>
    <p class="sub">MSC World Europa · 21–28 agosto 2026</p>

    <form id="f" autocomplete="on">
      <input type="password" id="pw" name="password" placeholder="Clave" autocomplete="current-password"
             autocapitalize="off" autocorrect="off" spellcheck="false" required>
      <button type="submit" id="go">Entrar</button>
      <label class="remember"><input type="checkbox" id="rm" checked> Recordar en este dispositivo</label>
    </form>

    <p class="msg" id="msg"></p>
    <p class="hint">El contenido está cifrado: sin la clave, este archivo no guarda nada legible.<br>Una vez dentro, puedes instalarla en la pantalla de inicio y funciona sin cobertura.</p>
  </div>

  var f = document.getElementById('f'), pw = document.getElementById('pw'),
      go = document.getElementById('go'), msg = document.getElementById('msg'),
      rm = document.getElementById('rm');

  function b64(s){ var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i=0;i<bin.length;i++) u[i] = bin.charCodeAt(i); return u; }

  if (!window.crypto || !crypto.subtle) {
    msg.textContent = 'Este navegador no puede descifrar aquí. Abre la página en https:// (no en http://).';
    go.disabled = true;
    return;
  }

  async function unlock(pass, silent){
    var enc = new TextEncoder();
    var base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    var key = await crypto.subtle.deriveKey(
      { name:'PBKDF2', salt:b64(SALT), iterations:ITER, hash:'SHA-256' },
      base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    var plain = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(IV) }, key, b64(DATA));
    var html = new TextDecoder().decode(plain);
    if (rm.checked || silent) { try { localStorage.setItem('crucero.k', pass); } catch(e){} }
    document.open(); document.write(html); document.close();
  }

  f.addEventListener('submit', async function(e){
    e.preventDefault();
    go.disabled = true; msg.textContent = ''; go.textContent = 'Abriendo…';
    try {
      await unlock(pw.value, false);
    } catch (err) {
      msg.textContent = 'Clave incorrecta.';
      go.disabled = false; go.textContent = 'Entrar';
      pw.select();
    }
  });

  // si ya se abrió antes en este dispositivo, entra sola
  try {
    var saved = localStorage.getItem('crucero.k');
    if (saved) unlock(saved, true).catch(function(){ localStorage.removeItem('crucero.k'); });
  } catch(e){}

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
